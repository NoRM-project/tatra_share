version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: tatra_share_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: share_db
      POSTGRES_USER: share_user
      POSTGRES_PASSWORD: share_pass
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: